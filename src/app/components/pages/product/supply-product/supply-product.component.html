
<app-status-response [status]="status"></app-status-response>
<div class="container__form">

  <form [formGroup]="formSupply" class="form" (ngSubmit)="validateProduct()">
    <h2 class="form__tittle">Add Supply</h2>
    <input-text [controlName]="'id'" [errorMessages]="errorMessages['id']" [placeHolder]="'Enter product id'" >
    </input-text>
    <input-text [controlName]="'name'" [errorMessages]="errorMessages['name']" [placeHolder]="'Enter product name'" >
  </input-text>
    <input-text [controlName]="'supply'" [errorMessages]="errorMessages['supply']" [placeHolder]="'Enter product supply'"
      [type]="'number'"></input-text>

      <div class="form__actions">
      <a class="form__cancel" [routerLink]="['..']">
        <app-button typeBtn="button" [isDisabled]="false" [isBackgroundBlack]="false">Cancel</app-button>
      </a>
      <div class="form__save">
        <app-button typeBtn="submit" [isDisabled]="formSupply.status!='VALID'">Save</app-button>
      </div>
    </div>
  </form>

</div>
