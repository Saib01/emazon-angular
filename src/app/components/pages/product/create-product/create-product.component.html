<div class="container__form">
  <form [formGroup]="formProduct" class="form" (ngSubmit)="validateProduct()">
    <h2 class="form__tittle">Registration</h2>
    <input-text [controlName]="'name'" [errorMessages]="errorMessages['name']" [placeHolder]="'Enter product name'">
    </input-text>
    <text-area [controlName]="'description'" [errorMessages]="errorMessages['description']"
      [placeHolder]="'Enter product description'"></text-area>
    <input-text [controlName]="'amount'" [errorMessages]="errorMessages['amount']" [placeHolder]="'Enter product amount'"
      [type]="'number'"></input-text>
    <input-text [controlName]="'price'" [errorMessages]="errorMessages['price']" [placeHolder]="'Enter product price'"
      [type]="'number'"></input-text>
      
    <simple-select formControlName="brand" [controlName]="'brand'" [options]="pageBrand.content" [errorMessages]="errorMessages['brand']"></simple-select>
    <multi-select formControlName="categoryList" [controlName]="'categoryList'" [options]="pageCategory.content" [errorMessages]="errorMessages['categoryList']"></multi-select>
    <div class="form__actions">
      <a class="form__cancel" [routerLink]="['..']">
        <app-button typeBtn="button" [isDisabled]="false" [isBackgroundBlack]="false">Cancel</app-button>
      </a>
      <div class="form__save">
        <app-button typeBtn="submit" [isDisabled]="formProduct.status!='VALID'">Save</app-button>
      </div>
    </div>
  </form>
</div>
